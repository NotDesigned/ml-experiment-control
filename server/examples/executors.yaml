# Replace backend identifiers and paths with operator-provisioned values.
executors:
  pai-h200:
    title: PAI DLC H200
    storage_root: /mnt/workspace/ml-expd
    data_root: /mnt/workspace
    capacity: {gpus: 8, cpus: 216, memory_gb: 1800}
    backend:
      kind: pai-dlc
      region: REPLACE_REGION
      workspace_id: REPLACE_WORKSPACE
      quota_id: REPLACE_QUOTA
      gpu_type: H200
      gpu_type_from_quota: true
      storage_id: REPLACE_CPFS_FILESYSTEM
      filesystem_type: cpfs
      cpfs_uri: bmcpfs://REPLACE_VERIFIED_CPFS_ENDPOINT/
      workspace_user: REPLACE_APPROVED_USER
      data_role_arn: acs:ram::REPLACE_ACCOUNT:role/pai-data-REPLACE_APPROVED_USER
  wyd-l40s:
    title: WYD L40S
    storage_root: /datapool/ml-expd
    data_root: /datapool
    backend:
      kind: slurm
      ssh_alias: wyd-cluster
      partition: gpu
      account: lab
      qos: normal
      gres: gpu:l40s:1
      mount_root: /datapool
      apptainer_unsquash: true
  sensecore-1gpu:
    title: SenseCore 1 GPU
    storage_root: /data/ml-expd
    data_root: /data
    gpus: 1
    capacity:
      gpus: 1
      cpus: 8
      memory_gb: 128
    backend:
      kind: sensecore
      workspace: REPLACE_WORKSPACE
      aec2: REPLACE_AEC2
      pool_selection: highest_spot
      allowed_clusters: [REPLACE_AEC2, REPLACE_OTHER_COMPUTE_AEC2]
      worker_spec: REPLACE_ONE_GPU_SPEC
      quota_type: spot
      storage_mount: REPLACE_VOLUME:/data
