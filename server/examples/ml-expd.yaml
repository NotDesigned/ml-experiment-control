schema_version: 1
index_db: ~/.local/state/ml-expd/index.sqlite
run_root: ~/.local/state/ml-expd/runs
project_registry_root: ~/.local/state/ml-expd/projects
project_import_roots: []
action_root: ~/.local/state/ml-expd/actions
http_auth:
  bearer_token_file: null
action_runtime:
  allow_project_writes: false
  allow_source_imports: false
  allow_scheduler_mutations: false
  scheduler_resource_approval: budget_cap
  max_gpu_hours_per_action: 1.0
  timeout_seconds: 300
  gate_ttl_seconds: 1800
telemetry:
  enabled: false
collector_enabled: true
poll_interval_seconds: 20
projects: []
