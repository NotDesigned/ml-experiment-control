name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.evidence.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: evidence
        run: python3 tools/ci_evidence.py plan
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          version: "0.11.28"
          enable-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - run: uv sync --locked --all-packages
      - run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: uv run mypy
      - run: uv run python tools/coverage_gate.py
      - run: uv run python tools/generate_cli_reference.py --check
      - run: uv run python -m compileall -q tools examples
      - name: Test daemon with independent 100% line and branch gates
        run: >-
          uv run --package ml-experiment-server python tools/coverage_gate.py
          --suite daemon --workers 2
      - name: Client coverage cannot regress below its measured baseline
        run: >-
          uv run --package ml-experiment-client python tools/coverage_gate.py
          --suite client --min-line 90.9 --min-branch 84.5
      - run: uv build --all-packages
      - name: Test standalone client wheel without server or core
        run: |
          uv venv .client-wheel-smoke
          uv pip install --python .client-wheel-smoke/bin/python --no-deps dist/ml_experiment_client-*.whl
          .client-wheel-smoke/bin/python tools/client_wheel_smoke.py
      - name: Test installed wheels and entry points
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/ml-expd --help
          .wheel-smoke/bin/ml-exp --help
      - name: Build and install offline deployment bundles
        run: |
          mkdir -p .ops/bundles
          uv run --no-project --python 3.12 --with pip --with setuptools --with wheel python tools/build_deployment_bundle.py --component server --wheels dist --output .ops/bundles/server-bundle.tar.gz
          python3 tools/build_deployment_bundle.py --component client --wheels dist --output .ops/bundles/client-bundle.tar.gz
          (cd .ops/bundles && sha256sum *.tar.gz > SHA256SUMS)
          tar -xzf .ops/bundles/server-bundle.tar.gz -C .ops/bundles
          tar -xzf .ops/bundles/client-bundle.tar.gz -C .ops/bundles
          .ops/bundles/ml-expd-server/install.sh "$PWD/.offline-server"
          .offline-server/bin/experiment-redact --help
          .ops/bundles/ml-expd-client/install.sh "$PWD/.offline-client"
          .offline-client/bin/python tools/client_wheel_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-linux-x86_64-py312
          path: |
            .ops/bundles/*.tar.gz
            .ops/bundles/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Record tested Git tree after all checks
        run: python3 tools/ci_evidence.py record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence-${{ github.run_attempt }}
          path: .ops/tested-tree.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
