name: rust-rewrite

on:
  push:
    branches: [rewrite/rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-rewrite-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: .ops/cargo-target

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/cargo-target
          key: rust-rewrite-v1-${{ runner.os }}-${{ runner.arch }}-1.85-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-rewrite-v1-${{ runner.os }}-${{ runner.arch }}-1.85-
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      - run: cargo build --locked --manifest-path rust/Cargo.toml --workspace --bins
      - name: Exercise native binaries with isolated temporary configuration
        run: bash rust/tests/preview-smoke.sh
