name: native-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: native-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TARGET_DIR: .ops/cargo-target

jobs:
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.evidence.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: evidence
        run: python3 tools/ci_evidence.py plan
        env:
          GH_TOKEN: ${{ github.token }}

  native:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.plan.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/cargo-target
          key: rust-rewrite-v1-${{ runner.os }}-${{ runner.arch }}-1.85-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            rust-rewrite-v1-${{ runner.os }}-${{ runner.arch }}-1.85-
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      - run: cargo build --locked --manifest-path rust/Cargo.toml --workspace --bins
      - name: Exercise native binaries with isolated temporary configuration
        run: bash rust/tests/preview-smoke.sh

  image-effects:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.plan.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rust/tests/image-bridge-requirements.txt
      - run: python -m pip install -r rust/tests/image-bridge-requirements.txt
      - name: Check optional image bridge without provider requests
        env:
          PYTHONPATH: server/src:src:worker/src
        run: python rust/tests/test_native_build_bridge.py
      - run: python rust/tests/test_materialization_launcher.py
      - run: python rust/tests/test_native_deploy.py
      - run: python -m unittest discover -s tests -p test_sync_diagnostic.py -v

  client-platforms:
    env:
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static -C link-arg=/Brepro' || '' }}
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.plan.outputs.full == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rust
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/cargo-target
          key: native-client-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            native-client-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - if: runner.os == 'macOS'
        run: echo "TMPDIR=$(python3 -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')" >> "$GITHUB_ENV"
      - name: Test client commands, uploads and verified transfers on the target OS
        shell: bash
        run: cargo test --locked --manifest-path rust/Cargo.toml -p ml-exp-client --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        name: Test Windows retained handles and credential permissions
        run: cargo test --locked --manifest-path rust/Cargo.toml -p ml-exp-io --lib

  test:
    needs: [plan, native, image-effects, client-platforms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require complete checks or verified exact-tree evidence
        env:
          REUSED: ${{ needs.plan.result == 'success' && needs.plan.outputs.full == 'false' }}
          NATIVE_RESULT: ${{ needs.native.result }}
          IMAGE_RESULT: ${{ needs.image-effects.result }}
          PLATFORMS_RESULT: ${{ needs.client-platforms.result }}
        run: |
          if [[ "$REUSED" != true ]]; then
            test "$NATIVE_RESULT" = success
            test "$IMAGE_RESULT" = success
            test "$PLATFORMS_RESULT" = success
          fi
      - uses: actions/checkout@v4
      - run: python3 tools/ci_evidence.py record
      - uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.run_attempt }}
          path: .ops/tested-tree.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
