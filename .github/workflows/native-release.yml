name: native-release

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable workspace version to package without publishing
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: .ops/native-release-target

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/native-release-target
          key: native-release-v1-${{ runner.os }}-${{ runner.arch }}-1.85-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            native-release-v1-${{ runner.os }}-${{ runner.arch }}-1.85-
      - name: Select and validate exact version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/native-v* ]]; then
            native_version="${GITHUB_REF_NAME#native-v}"
          else
            native_version="$REQUESTED_VERSION"
          fi
          python3 - "$native_version" <<'PY'
          import re, sys, tomllib
          value=sys.argv[1]
          assert re.fullmatch(r'(?:0|[1-9][0-9]{0,5})\.(?:0|[1-9][0-9]{0,5})\.(?:0|[1-9][0-9]{0,5})',value)
          with open('rust/Cargo.toml','rb') as stream: assert tomllib.load(stream)['workspace']['package']['version']==value
          PY
          echo "NATIVE_RELEASE_VERSION=$native_version" >> "$GITHUB_ENV"
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      - run: cargo build --locked --release --manifest-path rust/Cargo.toml --workspace --bins
      - name: Build a worker independent of the training image's glibc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          cargo build --locked --release --manifest-path rust/Cargo.toml -p ml-exp-worker --bins --target x86_64-unknown-linux-musl
          cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/ml-exp-worker-rs" "$CARGO_TARGET_DIR/release/ml-exp-worker-rs"
      - name: Test exact release executables
        env:
          NATIVE_PROFILE: release
        run: bash rust/tests/preview-smoke.sh
      - name: Package executables and deployment examples
        run: python3 tools/build_native_release.py --binary-dir "$CARGO_TARGET_DIR/release" --output .ops/native-dist --version "$NATIVE_RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: native-dist
          path: .ops/native-dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-dist
          path: native-dist
      - name: Publish immutable native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd native-dist
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --title "ML-Expd native ${GITHUB_REF_NAME#native-v}" --notes 'Native Linux x86_64 executables, exact hashes and deployment examples. See the bundled migration and usage guides. Deployment requires separate acceptance and existing-state checks.'
