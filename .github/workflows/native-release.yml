name: native-release

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable workspace version to package without publishing
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: .ops/native-release-target

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/native-release-target
          key: native-release-v1-${{ runner.os }}-${{ runner.arch }}-1.85-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            native-release-v1-${{ runner.os }}-${{ runner.arch }}-1.85-
      - name: Select and validate exact version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/native-v* ]]; then
            native_version="${GITHUB_REF_NAME#native-v}"
          else
            native_version="$REQUESTED_VERSION"
          fi
          python3 - "$native_version" <<'PY'
          import re, sys, tomllib
          value=sys.argv[1]
          assert re.fullmatch(r'(?:0|[1-9][0-9]{0,5})\.(?:0|[1-9][0-9]{0,5})\.(?:0|[1-9][0-9]{0,5})',value)
          with open('rust/Cargo.toml','rb') as stream: assert tomllib.load(stream)['workspace']['package']['version']==value
          PY
          echo "NATIVE_RELEASE_VERSION=$native_version" >> "$GITHUB_ENV"
      - run: cargo build --locked --release --manifest-path rust/Cargo.toml --workspace --bins
      - name: Build a worker independent of the training image's glibc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          cargo build --locked --release --manifest-path rust/Cargo.toml -p ml-exp-worker --bins --target x86_64-unknown-linux-musl
          cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/ml-exp-worker-rs" "$CARGO_TARGET_DIR/release/ml-exp-worker-rs"
      - name: Test exact release executables
        env:
          NATIVE_PROFILE: release
        run: bash rust/tests/preview-smoke.sh
      - name: Package executables and deployment examples
        run: |
          mkdir .ops/native-linux
          for program in ml-exp ml-expd-rs ml-exp-worker-rs; do
            cp "$CARGO_TARGET_DIR/release/$program" .ops/native-linux/
          done
      # A tag's cache is readable only by that tag, so only branch runs save one.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/native-release-target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: .ops/native-linux/*
          if-no-files-found: error
          retention-days: 3

  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/native-release-target
          key: native-release-checks-v1-${{ runner.os }}-${{ runner.arch }}-1.85-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            native-release-checks-v1-${{ runner.os }}-${{ runner.arch }}-1.85-
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      # A tag's cache is readable only by that tag, so only branch runs save one.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/native-release-target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  clients:
    env:
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static -C link-arg=/Brepro' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rust
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/native-release-target
          key: native-client-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            native-client-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - if: runner.os == 'macOS'
        run: echo "TMPDIR=$(python3 -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')" >> "$GITHUB_ENV"
      - name: Build and validate the exact platform client
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          native_version="${GITHUB_REF_NAME#native-v}"
          if [[ "$GITHUB_REF" != refs/tags/native-v* ]]; then native_version="$REQUESTED_VERSION"; fi
          cargo test --locked --manifest-path rust/Cargo.toml -p ml-exp-client --target ${{ matrix.target }}
          cargo build --locked --release --manifest-path rust/Cargo.toml -p ml-exp-client --target ${{ matrix.target }}
          native_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then native_suffix=.exe; fi
          native_binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/ml-exp$native_suffix"
          test "$("$native_binary" --version)" = "ml-exp $native_version"
          "$native_binary" --help
          mkdir .ops/native-client
          cp "$native_binary" ".ops/native-client/ml-exp-${{ matrix.target }}$native_suffix"
      # A tag's cache is readable only by that tag, so only branch runs save one.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ops/native-release-target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-client-${{ matrix.target }}
          path: .ops/native-client/*
          if-no-files-found: error
          retention-days: 3

  package:
    needs: [build, checks, clients]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: native-bin
      - uses: actions/download-artifact@v4
        with:
          pattern: native-client-*
          merge-multiple: true
          path: native-clients
      - name: Package all required platforms and exact hashes
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          native_version="${GITHUB_REF_NAME#native-v}"
          if [[ "$GITHUB_REF" != refs/tags/native-v* ]]; then native_version="$REQUESTED_VERSION"; fi
          chmod +x native-bin/*
          mkdir -p .ops
          python3 tools/build_native_release.py --binary-dir native-bin --client-dir native-clients --output .ops/native-dist --version "$native_version"
      - uses: actions/upload-artifact@v4
        with:
          name: native-dist
          path: .ops/native-dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-dist
          path: native-dist
      - name: Publish immutable native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd native-dist
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --title "ML-Expd native ${GITHUB_REF_NAME#native-v}" --notes 'Native ml-exp clients for Linux x86_64/ARM64, macOS Intel/Apple Silicon and Windows x86_64; Linux x86_64 API/worker bundle. Includes SHA256 manifests and POSIX/PowerShell installers. Clients through 0.1.15 require the new installer once for the ml-exp rename; saved configuration is retained. See the bundled usage and acceptance guides.'

  installer-smoke:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rust
      - name: Install and update the public Linux or macOS client
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          native_version="${GITHUB_REF_NAME#native-v}"
          native_prefix="$RUNNER_TEMP/ml-exp-public"
          bash rust/install.sh --version "$native_version" --prefix "$native_prefix"
          test "$("$native_prefix/ml-exp" --version)" = "ml-exp $native_version"
          "$native_prefix/ml-exp" update --check
          "$native_prefix/ml-exp" update
          test "$("$native_prefix/ml-exp" --version)" = "ml-exp $native_version"
      - name: Install and update the public Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = $env:GITHUB_REF_NAME.Substring('native-v'.Length)
          $Prefix = Join-Path $env:RUNNER_TEMP 'ml-exp-public'
          ./rust/install.ps1 -Version $Version -Prefix $Prefix -NoPath
          $Client = Join-Path $Prefix 'ml-exp.exe'
          if ((& $Client --version) -ne "ml-exp $Version") { throw 'Installed client version differs.' }
          & $Client update --check
          if ($LASTEXITCODE -ne 0) { throw 'Public update check failed.' }
          & $Client update
          if ($LASTEXITCODE -ne 0) { throw 'Public self replacement failed.' }
          if ((& $Client --version) -ne "ml-exp $Version") { throw 'Updated client version differs.' }
