[package]
name = "experiment-redact"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Credential redaction for experiment logs"
repository = "https://github.com/NotDesigned/ml-experiment-control"

[workspace]
members = [".", "crates/core", "crates/io", "crates/client", "crates/server", "crates/worker"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
experiment-redact = { path = "." }
regex = "1.12"
ml-exp-core = { path = "crates/core" }
ml-exp-io = { path = "crates/io" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision", "float_roundtrip"] }
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"] }
tempfile = "3"
libc = "0.2"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting"] }
rusqlite = { version = "0.39", features = ["bundled"] }
fs2 = "0.4"
rustix = { version = "1.1", features = ["fs", "process", "event"] }
getrandom = "0.3"
tar = "0.4.45"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[[bin]]
name = "experiment-redact"
path = "src/main.rs"

[dependencies]
regex = "1.12"
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
