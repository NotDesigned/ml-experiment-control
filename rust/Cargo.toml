[package]
name = "experiment-redact"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Credential redaction for experiment logs"
repository = "https://github.com/NotDesigned/ml-experiment-control"

[[bin]]
name = "experiment-redact"
path = "src/main.rs"

[dependencies]
regex = "1.12"
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
